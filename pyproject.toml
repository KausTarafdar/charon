[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "charon-ratelimit"
version = "0.1.0"
description = "High-performance, framework-agnostic distributed rate limiter for Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Kaustav Tarafdar" }]
keywords = ["rate-limit", "throttling", "redis", "asgi", "wsgi", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "charon-ratelimit[redis]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/KausTarafdar/charon"
Source = "https://github.com/KausTarafdar/charon"

[tool.hatch.build.targets.wheel]
packages = ["src/charon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "PLC"]
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.10"
files = ["src/charon"]
strict = true
warn_unused_ignores = false
